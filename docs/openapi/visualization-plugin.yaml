openapi: 3.0.0
info:
  title: SynBioHub Visualization Plugin API
  description: API specification for SynBioHub visualization plugin endpoints
  version: 1.0.0
paths:
  /status:
    get:
      summary: Plugin Status
      description: Checks if the plugin is operational.
      responses:
        "200":
          description: Plugin is running
          content:
            text/plain:
              schema:
                type: string
                example: "The plugin is up and running"

  /evaluate:
    post:
      summary: Evaluate Request
      description: Determines if the plugin can visualize the object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                url:
                  type: string
      responses:
        "200":
          description: Plugin can visualize the object
        "415":
          description: Plugin cannot visualize the object

  /run:
    post:
      summary: Run Plugin
      description: Executes the visualization plugin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the object to visualize
                complete_sbol:
                  type: string
                  description: URL to the complete SBOL of the object
      responses:
        "200":
          description: Visualization HTML
          content:
            text/html:
              schema:
                type: string
                description: HTML content to be embedded in SynBioHub
